trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

steps:

- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.12'

- script: |
    python --version
  displayName: 'Check Python Version'

- script: |
    python -m pip install --upgrade pip
    pip install -r backend/requirements.txt
  displayName: 'Install Dependencies'

- script: |
    python -c "import pandas123"
  displayName: 'Simulate Pipeline Failure'
  continueOnError: true

- script: |
    echo "PipelineIQ Azure DevOps Pipeline Executed"
  displayName: 'PipelineIQ Notification'