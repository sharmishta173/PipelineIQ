services:

  backend:
    build:
      context: ./backend

    container_name: pipelineiq-backend

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    volumes:
      - ./backend:/app

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend

    container_name: pipelineiq-frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend

  prometheus:
    image: prom/prometheus

    container_name: pipelineiq-prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml

    depends_on:
      - backend

  grafana:
    image: grafana/grafana

    container_name: pipelineiq-grafana

    ports:
      - "3000:3000"

    volumes:
      - grafana-storage:/var/lib/grafana

    depends_on:
      - prometheus

volumes:
  grafana-storage: